# ============================================
# Immo-Express NODUS — docker-compose.yml
# EVA Agent · NODUS SYSTEMS
# ============================================
services:
  immo-express:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: immo-express-nodus
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-nodus-systems-eva-secret-2026}
      - CORS_ORIGIN=*
    volumes:
      - immo-data:/app/backend/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - nodus-net

  nginx:
    image: nginx:alpine
    container_name: immo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./assets:/usr/share/nginx/html/assets:ro
    depends_on:
      - immo-express
    networks:
      - nodus-net

volumes:
  immo-data:

networks:
  nodus-net:
    driver: bridge