<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.12)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  
  <!-- Subtle inner shadow overlay -->
  <rect width="192" height="192" rx="40" fill="url(#shadow)"/>
  
  <!-- House body -->
  <rect x="44" y="86" width="104" height="74" rx="6" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="2.5"/>
  
  <!-- Roof -->
  <polygon points="96,34 30,88 162,88" fill="url(#roof)" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Roof ridge line -->
  <line x1="96" y1="34" x2="96" y2="88" stroke="rgba(37,99,235,0.15)" stroke-width="1.5"/>
  
  <!-- Door -->
  <rect x="76" y="130" width="40" height="30" rx="4" fill="rgba(255,255,255,0.35)"/>
  
  <!-- Door knob -->
  <circle cx="104" cy="148" r="3" fill="white" opacity="0.6"/>
  
  <!-- Left window -->
  <rect x="52" y="100" width="22" height="22" rx="3" fill="rgba(255,255,255,0.5)"/>
  <line x1="63" y1="100" x2="63" y2="122" stroke="white" stroke-width="1.5"/>
  <line x1="52" y1="111" x2="74" y2="111" stroke="white" stroke-width="1.5"/>
  
  <!-- Right window -->
  <rect x="118" y="100" width="22" height="22" rx="3" fill="rgba(255,255,255,0.5)"/>
  <line x1="129" y1="100" x2="129" y2="122" stroke="white" stroke-width="1.5"/>
  <line x1="118" y1="111" x2="140" y2="111" stroke="white" stroke-width="1.5"/>
  
  <!-- iE monogram on the house -->
  <text x="96" y="158" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="800" fill="white" letter-spacing="1">iE</text>
  
  <!-- Small accent dot -->
  <circle cx="162" cy="30" r="5" fill="rgba(255,255,255,0.3)"/>
  <circle cx="162" cy="30" r="2" fill="white" opacity="0.5"/>
</svg>